<div class="legend map-legend" aria-label="Status and map symbol legend" data-i18n-aria-label="mapSymbolLegend">
  <span><i class="legend-star green" aria-hidden="true"></i><b data-i18n="legendGreenMeaning">Full source observable</b></span>
  <span><i class="legend-star yellow" aria-hidden="true"></i><b data-i18n="legendYellowMeaning">Centre only</b></span>
  <span><i class="legend-star red" aria-hidden="true"></i><b data-i18n="legendRedMeaning">Centre unavailable</b></span>
  <span><i class="legend-star neutral" aria-hidden="true"></i><b data-i18n="nonGaiaSource">Non-Gaia source</b></span>
  <span><i class="legend-dot" aria-hidden="true"></i><b data-i18n="gaiaSource">Gaia calibration star</b></span>
  <span><i class="legend-extension" aria-hidden="true"></i><b data-i18n="trueExtension">True extension</b></span>
  <span><i class="legend-star selected" aria-hidden="true"></i><b data-i18n="selectedTarget">Selected target</b></span>
  <span id="tracked-fov-legend" hidden><i class="legend-tracking" aria-hidden="true"></i><b data-i18n="trackedFovSource">Tracked-FoV source</b></span>
